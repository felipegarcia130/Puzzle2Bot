slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link     # cámbialo si tu PuzzleBot usa otro nombre

    # Sensor
    scan_topic: /scan
    scan_queue_size: 10

    # Modo
    mode: mapping

    # Matching
    max_laser_range: 10.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    map_update_interval: 2.0

    # Resolución del mapa
    resolution: 0.05

    # Guardar sesión al salir
    map_file_name: ~/puzzlebot_map
    map_start_at_dock: false
